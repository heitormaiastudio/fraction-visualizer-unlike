<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Visualizer - Maia Studio</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --primary: #1e3a8a;
            --primary-light: #eff6ff;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-coral: #f43f5e;
            --fill-f1: #3b82f6;
            --fill-f2: #10b981;
            --fill-result: #8b5cf6;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .fraction-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .group-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .fraction-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fraction-line {
            width: 60px;
            height: 3px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        .stepper-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stepper-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.15s;
        }

        .stepper-btn:hover:not(:disabled) {
            background-color: var(--primary-light);
            border-color: var(--accent-blue);
        }

        .stepper-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .stepper-value {
            font-size: 1.5rem;
            font-weight: 700;
            width: 32px;
            text-align: center;
        }

        .op-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .op-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .op-btn.active {
            border-color: var(--accent-purple);
            background-color: var(--accent-purple);
            color: white;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2);
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 8px rgba(30, 58, 138, 0.25);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .error-message {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            margin-top: 16px;
            display: none;
        }

        /* Progress Bar & Stage Nodes */
        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 28px;
            position: relative;
        }

        .progress-stepper::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            gap: 6px;
        }

        .step-node {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .step-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-item.active .step-node {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .step-item.active .step-label {
            color: var(--primary);
        }

        .step-item.completed .step-node {
            border-color: var(--accent-green);
            background-color: var(--accent-green);
            color: white;
        }

        .step-item.skipped .step-node {
            border-color: var(--border-color);
            background-color: #e2e8f0;
            color: #94a3b8;
        }

        .step-item.skipped .step-label {
            color: #94a3b8;
            text-decoration: line-through;
        }

        @media (max-width: 640px) {
            .step-label {
                display: none;
            }
        }

        .stage-title-container {
            margin-bottom: 16px;
            text-align: center;
        }

        .stage-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            background-color: var(--primary-light);
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .stage-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stage-explanation {
            font-size: 1.05rem;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--accent-blue);
        }

        .visualization-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .bar-label {
            color: var(--text-muted);
        }

        .multi-bar-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .fraction-bar-wrapper {
            position: relative;
            width: 100%;
            height: 50px;
            background-color: #f1f5f9;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            overflow: hidden;
        }

        .fraction-bar-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .substage-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .math-expr-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 16px 0;
            padding: 12px;
            background-color: #f8fafc;
            border-radius: var(--radius-md);
            flex-wrap: wrap;
        }

        .fraction-inline {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            padding: 0 4px;
        }

        .fraction-inline .num {
            border-bottom: 2px solid var(--text-main);
            padding: 0 4px;
            line-height: 1.1;
        }

        .fraction-inline .den {
            padding: 0 4px;
            line-height: 1.1;
        }

        .multiplier-highlight {
            color: var(--accent-coral);
            font-weight: 800;
        }

        footer {
            margin-top: auto;
            padding-top: 32px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .brand-logo-background {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            border-radius: 12px;
            padding: 12px 20px;
            margin: 0 auto 10px;
        }

        .brand-logo {
            display: block;
            width: 170px;
            max-width: 100%;
            height: auto;
            margin: 0;
        }

        .copyright {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .badge-lcd {
            background-color: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="app-title">FRACTION VISUALIZER</h1>
        <p class="app-subtitle">See why common denominators work.</p>
    </header>

    <div class="main-container">
        
        <!-- CONTROL PANEL -->
        <div class="panel" id="control-panel">
            <div class="controls-grid">
                <div class="fraction-input-group">
                    <span class="group-label">First Fraction</span>
                    <div class="fraction-selector">
                        <div class="stepper-control">
                            <button class="stepper-btn" onclick="changeVal('n1', -1)">-</button>
                            <span class="stepper-value" id="disp-n1">1</span>
                            <button class="stepper-btn" onclick="changeVal('n1', 1)">+</button>
                        </div>
                        <div class="fraction-line"></div>
                        <div class="stepper-control">
                            <button class="stepper-btn" onclick="changeVal('d1', -1)">-</button>
                            <span class="stepper-value" id="disp-d1">2</span>
                            <button class="stepper-btn" onclick="changeVal('d1', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="op-selector">
                    <button class="op-btn active" id="op-add" onclick="setOp('+')">+</button>
                    <button class="op-btn" id="op-sub" onclick="setOp('-')">−</button>
                </div>

                <div class="fraction-input-group">
                    <span class="group-label">Second Fraction</span>
                    <div class="fraction-selector">
                        <div class="stepper-control">
                            <button class="stepper-btn" onclick="changeVal('n2', -1)">-</button>
                            <span class="stepper-value" id="disp-n2">1</span>
                            <button class="stepper-btn" onclick="changeVal('n2', 1)">+</button>
                        </div>
                        <div class="fraction-line"></div>
                        <div class="stepper-control">
                            <button class="stepper-btn" onclick="changeVal('d2', -1)">-</button>
                            <span class="stepper-value" id="disp-d2">3</span>
                            <button class="stepper-btn" onclick="changeVal('d2', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="error-message" id="error-msg"></div>

            <div class="action-bar">
                <button class="btn-primary" id="btn-show" onclick="startVisualization()">SHOW ME</button>
                <button class="btn-secondary" onclick="resetToDefault()">RESET</button>
            </div>
        </div>

        <!-- VISUALIZATION PANEL -->
        <div class="panel" id="vis-panel" style="display: none;">
            
            <div class="progress-stepper" id="progress-bar">
                <div class="step-item" id="step-item-1">
                    <div class="step-node">1</div>
                    <span class="step-label">Compare</span>
                </div>
                <div class="step-item" id="step-item-2">
                    <div class="step-node">2</div>
                    <span class="step-label">LCD</span>
                </div>
                <div class="step-item" id="step-item-3">
                    <div class="step-node">3</div>
                    <span class="step-label">Equivalent</span>
                </div>
                <div class="step-item" id="step-item-4">
                    <div class="step-node">4</div>
                    <span class="step-label">Operate</span>
                </div>
                <div class="step-item" id="step-item-5">
                    <div class="step-node">5</div>
                    <span class="step-label">Simplify</span>
                </div>
            </div>

            <div class="stage-title-container">
                <span class="stage-badge" id="stage-badge">Stage 1</span>
                <h2 class="stage-title" id="stage-title">Compare the Fractions</h2>
            </div>

            <div class="stage-explanation" id="stage-explanation"></div>

            <div class="visualization-area" id="vis-area"></div>

            <div class="substage-controls">
                <button class="btn-secondary" id="btn-prev-stage" onclick="prevStage()" style="display: none;">← Back</button>
                <div style="flex: 1;"></div>
                <button class="btn-secondary" id="btn-new-example" onclick="newExample()" style="display: none;">NEW EXAMPLE</button>
                <button class="btn-primary" id="btn-next-stage" onclick="nextStage()">Next →</button>
            </div>

        </div>

    </div>

    <footer>
        <div class="brand-logo-background"><img class="brand-logo" src="logo-maia.png" alt="Maia Studio — Where Play Leads to Learning"></div>
        <div class="copyright">© Maia Studio — Licensed for single-classroom use.<br>Sharing or redistributing this file is not permitted.</div>
    </footer>

    <script>
        // State
        let state = {
            n1: 1, d1: 2,
            n2: 1, d2: 3,
            op: '+',
            currentStage: 1
        };

        // Exact Integer Mathematical Engine
        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function lcm(a, b) {
            if (a === 0 || b === 0) return 0;
            return Math.abs((a * b) / gcd(a, b));
        }

        function simplify(n, d) {
            let common = gcd(n, d);
            return { num: n / common, den: d / common, factor: common };
        }

        // Stepper & Control Interactions
        function changeVal(param, delta) {
            if (param === 'd1') {
                state.d1 = Math.max(2, Math.min(12, state.d1 + delta));
                if (state.n1 >= state.d1) state.n1 = state.d1 - 1;
            } else if (param === 'd2') {
                state.d2 = Math.max(2, Math.min(12, state.d2 + delta));
                if (state.n2 >= state.d2) state.n2 = state.d2 - 1;
            } else if (param === 'n1') {
                state.n1 = Math.max(1, Math.min(state.d1 - 1, state.n1 + delta));
            } else if (param === 'n2') {
                state.n2 = Math.max(1, Math.min(state.d2 - 1, state.n2 + delta));
            }
            validateAndRenderControls();
        }

        function setOp(op) {
            state.op = op;
            document.getElementById('op-add').classList.toggle('active', op === '+');
            document.getElementById('op-sub').classList.toggle('active', op === '-');
            validateAndRenderControls();
        }

        function resetToDefault() {
            state.n1 = 1; state.d1 = 2;
            state.n2 = 1; state.d2 = 3;
            state.op = '+';
            setOp('+');
            validateAndRenderControls();
            document.getElementById('vis-panel').style.display = 'none';
        }

        function newExample() {
            document.getElementById('vis-panel').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function validateAndRenderControls() {
            document.getElementById('disp-n1').innerText = state.n1;
            document.getElementById('disp-d1').innerText = state.d1;
            document.getElementById('disp-n2').innerText = state.n2;
            document.getElementById('disp-d2').innerText = state.d2;

            const errEl = document.getElementById('error-msg');
            let isInvalid = false;

            // Exact integer comparison for subtraction: n2/d2 > n1/d1 <=> n2 * d1 > n1 * d2
            if (state.op === '-') {
                if ((state.n2 * state.d1) > (state.n1 * state.d2)) {
                    errEl.innerText = "For subtraction, choose a second fraction that is smaller than or equal to the first fraction.";
                    errEl.style.display = 'block';
                    isInvalid = true;
                }
            }

            if (!isInvalid) {
                errEl.style.display = 'none';
            }

            document.getElementById('btn-show').disabled = isInvalid;
            return !isInvalid;
        }

        function startVisualization() {
            if (!validateAndRenderControls()) {
                document.getElementById('vis-panel').style.display = 'none';
                return;
            }

            document.getElementById('vis-panel').style.display = 'block';
            state.currentStage = 1;
            renderStage();
            document.getElementById('vis-panel').scrollIntoView({ behavior: 'smooth' });
        }

        function nextStage() {
            if (state.currentStage === 5) {
                newExample();
                return;
            }

            const isSameDen = (state.d1 === state.d2);
            if (isSameDen && state.currentStage === 1) {
                state.currentStage = 4;
            } else if (state.currentStage < 5) {
                state.currentStage++;
            }
            renderStage();
        }

        function prevStage() {
            const isSameDen = (state.d1 === state.d2);
            if (isSameDen && state.currentStage === 4) {
                state.currentStage = 1;
            } else if (state.currentStage > 1) {
                state.currentStage--;
            }
            renderStage();
        }

        // Universal Fraction Bar Visual Engine (Supports Multi-Whole Improper Fractions)
        function createSingleBarSVG(numFilled, totalDen, primaryColor, options = {}) {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "fraction-bar-svg");
            svg.setAttribute("viewBox", "0 0 1000 100");
            svg.setAttribute("preserveAspectRatio", "none");

            const width = 1000;
            const height = 100;
            const pieceWidth = width / totalDen;

            // Render pieces
            for (let i = 0; i < totalDen; i++) {
                const rect = document.createElementNS(svgNS, "rect");
                rect.setAttribute("x", i * pieceWidth);
                rect.setAttribute("y", 0);
                rect.setAttribute("width", pieceWidth);
                rect.setAttribute("height", height);

                let isPrimaryFilled = i < numFilled;
                let isSecondFilled = options.secondNum && (i >= numFilled && i < (numFilled + options.secondNum));

                if (isPrimaryFilled) {
                    rect.setAttribute("fill", primaryColor);
                } else if (isSecondFilled) {
                    rect.setAttribute("fill", options.secondColor || '#10b981');
                } else {
                    rect.setAttribute("fill", "#f1f5f9");
                }

                // Subtraction take-away visual style
                if (options.takeAwayNum && (i >= (numFilled - options.takeAwayNum) && i < numFilled)) {
                    rect.setAttribute("fill", "#e2e8f0");
                }

                svg.appendChild(rect);

                // Strike-through line for removed pieces
                if (options.takeAwayNum && (i >= (numFilled - options.takeAwayNum) && i < numFilled)) {
                    const line1 = document.createElementNS(svgNS, "line");
                    line1.setAttribute("x1", i * pieceWidth + 4);
                    line1.setAttribute("y1", 4);
                    line1.setAttribute("x2", (i + 1) * pieceWidth - 4);
                    line1.setAttribute("y2", height - 4);
                    line1.setAttribute("stroke", "#f43f5e");
                    line1.setAttribute("stroke-width", "4");
                    svg.appendChild(line1);

                    const line2 = document.createElementNS(svgNS, "line");
                    line2.setAttribute("x1", (i + 1) * pieceWidth - 4);
                    line2.setAttribute("y1", 4);
                    line2.setAttribute("x2", i * pieceWidth + 4);
                    line2.setAttribute("y2", height - 4);
                    line2.setAttribute("stroke", "#f43f5e");
                    line2.setAttribute("stroke-width", "4");
                    svg.appendChild(line2);
                }
            }

            // Subdivisions (Stage 3) - dash lines
            if (options.subdivisionsPerPiece && options.subdivisionsPerPiece > 1) {
                const subDen = totalDen * options.subdivisionsPerPiece;
                const subWidth = width / subDen;
                for (let j = 1; j < subDen; j++) {
                    if (j % options.subdivisionsPerPiece !== 0) {
                        const line = document.createElementNS(svgNS, "line");
                        line.setAttribute("x1", j * subWidth);
                        line.setAttribute("y1", 0);
                        line.setAttribute("x2", j * subWidth);
                        line.setAttribute("y2", height);
                        line.setAttribute("stroke", "#ffffff");
                        line.setAttribute("stroke-width", "3");
                        line.setAttribute("stroke-dasharray", "6,4");
                        svg.appendChild(line);
                    }
                }
            }

            // Primary piece boundaries
            for (let i = 1; i < totalDen; i++) {
                const line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", i * pieceWidth);
                line.setAttribute("y1", 0);
                line.setAttribute("x2", i * pieceWidth);
                line.setAttribute("y2", height);
                line.setAttribute("stroke", "#ffffff");
                line.setAttribute("stroke-width", "4");
                svg.appendChild(line);
            }

            // Outer border
            const border = document.createElementNS(svgNS, "rect");
            border.setAttribute("x", 0);
            border.setAttribute("y", 0);
            border.setAttribute("width", width);
            border.setAttribute("height", height);
            border.setAttribute("fill", "none");
            border.setAttribute("stroke", "#cbd5e1");
            border.setAttribute("stroke-width", "4");
            svg.appendChild(border);

            return svg;
        }

        // Reusable multi-bar generator for improper fractions
        function createFractionBars(num, den, color, options = {}) {
            const group = document.createElement('div');
            group.className = 'multi-bar-group';

            if (num === 0) {
                const wrapper = document.createElement('div');
                wrapper.className = 'fraction-bar-wrapper';
                wrapper.appendChild(createSingleBarSVG(0, den, color, options));
                group.appendChild(wrapper);
                return group;
            }

            let primaryRemaining = num;
            let secondRemaining = options.secondNum || 0;

            let barIndex = 0;
            while (primaryRemaining > 0 || secondRemaining > 0 || (barIndex === 0 && (num % den) === 0)) {
                let currentBarPrimary = Math.min(primaryRemaining, den);
                primaryRemaining -= currentBarPrimary;

                let spaceLeftInBar = den - currentBarPrimary;
                let currentBarSecond = Math.min(secondRemaining, spaceLeftInBar);
                secondRemaining -= currentBarSecond;

                const wrapper = document.createElement('div');
                wrapper.className = 'fraction-bar-wrapper';

                let barOpts = { ...options };
                if (options.secondNum) {
                    barOpts.secondNum = currentBarSecond;
                }

                wrapper.appendChild(createSingleBarSVG(currentBarPrimary, den, color, barOpts));
                group.appendChild(wrapper);

                barIndex++;
                if (primaryRemaining <= 0 && secondRemaining <= 0) break;
            }

            return group;
        }

        function createBarContainer(labelText, num, den, color, options = {}) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bar-container';

            const header = document.createElement('div');
            header.className = 'bar-header';
            header.innerHTML = `<span class="bar-label">${labelText}</span>`;

            wrapper.appendChild(header);
            wrapper.appendChild(createFractionBars(num, den, color, options));
            return wrapper;
        }

        // Render Guided Stages
        function renderStage() {
            const visArea = document.getElementById('vis-area');
            visArea.innerHTML = '';

            const commonDen = lcm(state.d1, state.d2);
            const isSameDen = (state.d1 === state.d2);
            const m1 = commonDen / state.d1;
            const m2 = commonDen / state.d2;
            const eqN1 = state.n1 * m1;
            const eqN2 = state.n2 * m2;

            // Progress Stepper UI updates
            for (let i = 1; i <= 5; i++) {
                const item = document.getElementById(`step-item-${i}`);
                item.classList.remove('active', 'completed', 'skipped');

                if (isSameDen && (i === 2 || i === 3)) {
                    item.classList.add('skipped');
                } else if (i === state.currentStage) {
                    item.classList.add('active');
                } else if (i < state.currentStage) {
                    item.classList.add('completed');
                }
            }

            document.getElementById('btn-prev-stage').style.display = (state.currentStage > 1) ? 'inline-block' : 'none';
            document.getElementById('btn-new-example').style.display = (state.currentStage === 5) ? 'inline-block' : 'none';

            switch (state.currentStage) {
                case 1: renderStage1(visArea, isSameDen); break;
                case 2: renderStage2(visArea, commonDen); break;
                case 3: renderStage3(visArea, commonDen, m1, m2, eqN1, eqN2); break;
                case 4: renderStage4(visArea, commonDen, eqN1, eqN2); break;
                case 5: renderStage5(visArea, commonDen, eqN1, eqN2); break;
            }
        }

        // STAGE 1
        function renderStage1(container, isSameDen) {
            document.getElementById('stage-badge').innerText = "Stage 1 of 5";
            document.getElementById('stage-title').innerText = "Compare the Fractions";

            const exp = document.getElementById('stage-explanation');
            if (isSameDen) {
                exp.innerText = "The pieces are already the same size. No new denominator is needed.";
            } else {
                exp.innerText = "The pieces are different sizes. We need equal-sized pieces before we can add or subtract them.";
            }

            container.appendChild(createBarContainer(`First Fraction: ${state.n1}/${state.d1}`, state.n1, state.d1, 'var(--fill-f1)'));
            container.appendChild(createBarContainer(`Second Fraction: ${state.n2}/${state.d2}`, state.n2, state.d2, 'var(--fill-f2)'));

            const nextBtn = document.getElementById('btn-next-stage');
            nextBtn.innerText = isSameDen ? "GO TO OPERATION →" : "FIND A COMMON DENOMINATOR →";
        }

        // STAGE 2
        function renderStage2(container, commonDen) {
            document.getElementById('stage-badge').innerText = "Stage 2 of 5";
            document.getElementById('stage-title').innerText = "Find the Common Denominator";

            const exp = document.getElementById('stage-explanation');
            const mults1 = getMultiplesUpTo(state.d1, commonDen);
            const mults2 = getMultiplesUpTo(state.d2, commonDen);

            exp.innerHTML = `Find a multiple both denominators share. The least common denominator (LCD) keeps the numbers smaller.<br><br>
            Multiples of ${state.d1}: ${formatMultiples(mults1, commonDen)}<br>
            Multiples of ${state.d2}: ${formatMultiples(mults2, commonDen)}<br><br>
            <strong>Least Common Denominator (LCD) = <span class="badge-lcd">${commonDen}</span></strong>`;

            container.appendChild(createBarContainer(`${state.n1}/${state.d1}`, state.n1, state.d1, 'var(--fill-f1)'));
            container.appendChild(createBarContainer(`${state.n2}/${state.d2}`, state.n2, state.d2, 'var(--fill-f2)'));

            document.getElementById('btn-next-stage').innerText = "MAKE EQUIVALENT FRACTIONS →";
        }

        // STAGE 3
        function renderStage3(container, commonDen, m1, m2, eqN1, eqN2) {
            document.getElementById('stage-badge').innerText = "Stage 3 of 5";
            document.getElementById('stage-title').innerText = "Make Equivalent Fractions";

            const exp = document.getElementById('stage-explanation');
            exp.innerHTML = `Multiply the numerator and denominator by the same number.<br><strong>The amount stayed the same. Only the pieces were divided into smaller equal parts.</strong>`;

            const mathBox = document.createElement('div');
            mathBox.className = 'math-expr-display';
            mathBox.innerHTML = `
                <div>${getFractionHTML(state.n1, state.d1)} × <span class="multiplier-highlight">${getFractionHTML(m1, m1)}</span> = ${getFractionHTML(eqN1, commonDen)}</div>
                <div style="margin: 0 16px;">and</div>
                <div>${getFractionHTML(state.n2, state.d2)} × <span class="multiplier-highlight">${getFractionHTML(m2, m2)}</span> = ${getFractionHTML(eqN2, commonDen)}</div>
            `;
            container.appendChild(mathBox);

            container.appendChild(createBarContainer(`${state.n1}/${state.d1} = ${eqN1}/${commonDen}`, state.n1, state.d1, 'var(--fill-f1)', { subdivisionsPerPiece: m1 }));
            container.appendChild(createBarContainer(`${state.n2}/${state.d2} = ${eqN2}/${commonDen}`, state.n2, state.d2, 'var(--fill-f2)', { subdivisionsPerPiece: m2 }));

            const actionWord = state.op === '+' ? "ADD" : "SUBTRACT";
            document.getElementById('btn-next-stage').innerText = `${actionWord} THE FRACTIONS →`;
        }

        // STAGE 4
        function renderStage4(container, commonDen, eqN1, eqN2) {
            document.getElementById('stage-badge').innerText = "Stage 4 of 5";

            const exp = document.getElementById('stage-explanation');

            if (state.op === '+') {
                document.getElementById('stage-title').innerText = "Add the Fractions";
                exp.innerText = "Same-sized pieces → same denominator → now we can add the numerators.";

                const totalNum = eqN1 + eqN2;

                const mathBox = document.createElement('div');
                mathBox.className = 'math-expr-display';
                mathBox.innerHTML = `${getFractionHTML(eqN1, commonDen)} + ${getFractionHTML(eqN2, commonDen)} = ${getFractionHTML(totalNum, commonDen)}`;
                container.appendChild(mathBox);

                container.appendChild(createBarContainer(`Result: ${totalNum}/${commonDen}`, eqN1, commonDen, 'var(--fill-f1)', { secondNum: eqN2, secondColor: 'var(--fill-f2)' }));

            } else {
                document.getElementById('stage-title').innerText = "Subtract the Fractions";
                exp.innerText = "Same-sized pieces → same denominator → now we can subtract the numerators.";

                const remainingNum = eqN1 - eqN2;

                const mathBox = document.createElement('div');
                mathBox.className = 'math-expr-display';
                mathBox.innerHTML = `${getFractionHTML(eqN1, commonDen)} − ${getFractionHTML(eqN2, commonDen)} = ${getFractionHTML(remainingNum, commonDen)}`;
                container.appendChild(mathBox);

                // 3 Clear Visual Moments for Subtraction
                container.appendChild(createBarContainer(`1. Starting Amount: ${eqN1}/${commonDen}`, eqN1, commonDen, 'var(--fill-f1)'));
                container.appendChild(createBarContainer(`2. Take Away ${eqN2}/${commonDen}`, eqN1, commonDen, 'var(--fill-f1)', { takeAwayNum: eqN2 }));
                container.appendChild(createBarContainer(`3. Remaining Amount: ${remainingNum}/${commonDen}`, remainingNum, commonDen, 'var(--fill-f1)'));
            }

            document.getElementById('btn-next-stage').innerText = "SIMPLIFY RESULT →";
        }

        // STAGE 5
        function renderStage5(container, commonDen, eqN1, eqN2) {
            document.getElementById('stage-badge').innerText = "Stage 5 of 5";
            document.getElementById('stage-title').innerText = "Simplify & Final Answer";

            const rawNum = state.op === '+' ? (eqN1 + eqN2) : (eqN1 - eqN2);
            const simp = simplify(rawNum, commonDen);
            const exp = document.getElementById('stage-explanation');

            let resultMathHTML = `${getFractionHTML(rawNum, commonDen)}`;

            if (rawNum === commonDen) {
                resultMathHTML += ` = 1`;
            } else {
                if (simp.factor > 1) {
                    resultMathHTML += ` = ${getFractionHTML(simp.num, simp.den)}`;
                }

                if (rawNum > commonDen && commonDen > 1) {
                    let mixedWhole = Math.floor(rawNum / commonDen);
                    let mixedNum = rawNum % commonDen;
                    if (mixedNum === 0) {
                        resultMathHTML += ` = ${mixedWhole}`;
                    } else {
                        let simpMixed = simplify(mixedNum, commonDen);
                        resultMathHTML += ` = ${mixedWhole} ${getFractionHTML(simpMixed.num, simpMixed.den)}`;
                    }
                }
            }

            const mathBox = document.createElement('div');
            mathBox.className = 'math-expr-display';
            mathBox.innerHTML = `Final Answer: ${resultMathHTML}`;
            container.appendChild(mathBox);

            let explanationText = "";

            if (simp.factor > 1) {
                explanationText = "Divide the numerator and denominator by the same factor. The pieces changed size, but the amount stayed the same.";
            } else {
                explanationText = "Already in simplest form!";
            }

            if (rawNum > commonDen) {
                explanationText += " Your answer is greater than one whole.";
            }

            exp.innerText = explanationText;

            if (simp.factor > 1 && rawNum !== commonDen) {
                container.appendChild(createBarContainer(`Unsimplified: ${rawNum}/${commonDen}`, rawNum, commonDen, 'var(--fill-result)'));
                container.appendChild(createBarContainer(`Simplest Form: ${simp.num}/${simp.den}`, simp.num, simp.den, 'var(--accent-purple)'));
            } else {
                container.appendChild(createBarContainer(`Final Answer: ${rawNum}/${commonDen}`, rawNum, commonDen, 'var(--fill-result)'));
            }

            document.getElementById('btn-next-stage').innerText = "DONE";
        }

        // Formatting Helpers
        function getFractionHTML(num, den) {
            return `<span class="fraction-inline"><span class="num">${num}</span><span class="den">${den}</span></span>`;
        }

        function getMultiplesUpTo(n, target) {
            let mults = [];
            for (let i = n; i <= target; i += n) {
                mults.push(i);
            }
            return mults;
        }

        function formatMultiples(arr, highlightVal) {
            return arr.map(v => v === highlightVal ? `<strong style="color:var(--accent-coral); font-size:1.1rem;">${v}</strong>` : v).join(', ');
        }

        // Initialize App
        validateAndRenderControls();
    </script>
</body>
